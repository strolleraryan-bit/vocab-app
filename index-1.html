<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a1a2e">
<meta name="description" content="Build and track your English vocabulary — Hindi meanings, definitions, and usage examples, page by page.">

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vocab">

<title>Vocab by Aryan</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    /* text colors — adapt between light/dark */
    --ink: #1a1a2e;
    --ink-mid: #2d2d4e;
    --ink-light: #6b6b8a;
    /* page backgrounds — adapt */
    --paper: #fafaf7;
    --paper-warm: #f4f2ec;
    --card-bg: #ffffff;
    --row-hover: #f9f9fd;
    /* "chrome" bars (header/input bar/table head/toast) — always dark navy,
       same in both themes, so text on them (usually white) never needs to change */
    --chrome: #1a1a2e;
    --chrome-mid: #2d2d4e;
    --chrome-border: #3d3d5e;
    /* accents — adapt slightly for contrast on dark bg */
    --accent: #4f46e5;
    --accent-solid: #4f46e5;
    --accent-soft: #eef2ff;
    --accent-mid: #818cf8;
    --gold: #d97706;
    --gold-soft: #fef3c7;
    --gold-strong: #f59e0b;
    --border: #e2e0d8;
    --red: #dc2626;
    --red-soft: #fee2e2;
    --green: #059669;
    --skeleton-a: #eef2ff;
    --skeleton-b: #dde5ff;
    --delete-color: #cccccc;
    --row-delete-color: #c5c5d5;
    --star-empty: #d9d9e8;
    --hint-color: #aaaaaa;
    --highlight-flash: #fef3c7;
    --shadow: 0 4px 24px rgba(26,26,46,0.08);
    --shadow-lg: 0 8px 40px rgba(26,26,46,0.12);
  }

  html[data-theme="dark"] {
    --ink: #e9e9f3;
    --ink-mid: #c4c4de;
    --ink-light: #9494b8;
    --paper: #121220;
    --paper-warm: #1c1c2e;
    --card-bg: #1a1a2a;
    --row-hover: #22223a;
    --chrome: #0e0e18;
    --chrome-mid: #1a1a2c;
    --chrome-border: #2c2c46;
    --accent: #818cf8;
    --accent-soft: rgba(129,140,248,0.16);
    --accent-mid: #a5b4fc;
    --gold: #fbbf24;
    --gold-soft: rgba(217,119,6,0.22);
    --gold-strong: #fbbf24;
    --border: #32324a;
    --red: #f87171;
    --red-soft: rgba(248,113,113,0.18);
    --green: #34d399;
    --skeleton-a: #23233a;
    --skeleton-b: #2d2d4c;
    --delete-color: #6b6b8a;
    --row-delete-color: #6b6b8a;
    --star-empty: #3a3a54;
    --hint-color: #8888ac;
    --highlight-flash: rgba(217,119,6,0.4);
    --shadow: 0 4px 24px rgba(0,0,0,0.4);
    --shadow-lg: 0 8px 40px rgba(0,0,0,0.55);
  }

  html { transition: background 0.25s; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
    transition: background 0.25s, color 0.25s;
  }

  /* ── HEADER ── */
  header {
    background: var(--chrome);
    padding: 0 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 60px;
    position: sticky;
    top: 0;
    z-index: 100;
    transition: background 0.25s;
  }
  .logo {
    font-family: 'Playfair Display', serif;
    font-size: 1.4rem;
    font-weight: 700;
    color: #fff;
    letter-spacing: -0.02em;
  }
  .logo span { color: var(--accent-mid); }
  .header-meta {
    font-size: 0.75rem;
    color: #7070a0;
    font-weight: 400;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-right: auto;
    margin-left: 1.5rem;
  }
  .header-actions {
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .header-icon-btn {
    background: rgba(255,255,255,0.06);
    border: 1.5px solid rgba(255,255,255,0.12);
    color: #c0c0e0;
    padding: 0.4rem 0.8rem;
    border-radius: 6px;
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    cursor: pointer;
    transition: all 0.15s;
    font-family: 'Inter', sans-serif;
    white-space: nowrap;
  }
  .header-icon-btn:hover {
    background: var(--accent-solid);
    border-color: var(--accent-solid);
    color: #fff;
  }
  @media (max-width: 640px) {
    header { flex-wrap: wrap; height: auto; padding: 0.6rem 1rem; gap: 0.5rem; }
    .header-meta { display: none; }
    .header-actions { margin-left: auto; }
  }

  /* ── INPUT BAR ── */
  .input-zone {
    background: var(--chrome-mid);
    padding: 1.25rem 2rem;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 1rem;
    border-bottom: 1px solid var(--chrome-border);
    position: sticky;
    z-index: 90;
    transition: background 0.25s;
  }
  .word-input-wrap {
    display: flex;
    align-items: center;
    background: rgba(255,255,255,0.06);
    border: 1.5px solid rgba(255,255,255,0.12);
    border-radius: 8px;
    overflow: hidden;
    flex: 1 1 220px;
    min-width: 0;
    max-width: 480px;
    transition: border-color 0.2s;
  }
  .word-input-wrap:focus-within {
    border-color: var(--accent-mid);
    background: rgba(255,255,255,0.09);
  }
  #wordInput {
    flex: 1;
    min-width: 0;
    background: transparent;
    border: none;
    outline: none;
    color: #fff;
    font-size: 1rem;
    font-family: 'Inter', sans-serif;
    padding: 0.7rem 1rem;
    letter-spacing: 0.02em;
  }
  #wordInput::placeholder { color: #6060a0; }
  #addBtn {
    background: var(--accent-solid);
    border: none;
    color: #fff;
    width: 42px;
    height: 42px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 1.1rem;
    font-weight: 700;
    transition: background 0.2s, transform 0.1s;
    font-family: 'Inter', sans-serif;
  }
  #addBtn:hover { background: #4338ca; }
  #addBtn:active { transform: scale(0.93); }
  #addBtn:disabled { background: #404070; opacity: 0.5; cursor: not-allowed; }
  .word-count-badge {
    font-size: 0.75rem;
    color: #8080b0;
    margin-left: auto;
    flex-shrink: 0;
    white-space: nowrap;
    font-family: 'JetBrains Mono', monospace;
  }
  .word-count-badge strong { color: var(--accent-mid); }

  /* ── STATUS TOAST ── */
  #statusBar {
    position: fixed;
    top: 70px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--chrome);
    color: #fff;
    padding: 0.6rem 1.4rem;
    border-radius: 16px;
    font-size: 0.82rem;
    font-weight: 500;
    z-index: 999;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    box-shadow: var(--shadow-lg);
    max-width: min(92vw, 420px);
    width: max-content;
    white-space: normal;
    text-align: center;
    line-height: 1.4;
  }
  #statusBar.show { opacity: 1; }
  #statusBar.error { background: #7f1d1d; }
  .spinner {
    width: 14px; height: 14px;
    border: 2px solid rgba(255,255,255,0.2);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── NIGHT MODE FAB ── */
  #themeFab {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: var(--chrome);
    border: 1.5px solid rgba(255,255,255,0.15);
    color: #fff;
    font-size: 1.3rem;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 950;
    box-shadow: var(--shadow-lg);
    transition: background 0.25s, transform 0.15s;
  }
  #themeFab:hover { transform: scale(1.08); }
  #themeFab:active { transform: scale(0.94); }

  /* ── MAIN CONTENT ── */
  .main {
    max-width: 1300px;
    margin: 0 auto;
    padding: 2rem;
  }

  /* ── EMPTY STATE ── */
  .empty-state {
    text-align: center;
    padding: 5rem 2rem;
  }
  .empty-icon {
    font-size: 4rem;
    margin-bottom: 1rem;
    opacity: 0.3;
  }
  .empty-state h2 {
    font-family: 'Playfair Display', serif;
    font-size: 1.8rem;
    color: var(--ink-light);
    margin-bottom: 0.5rem;
    font-weight: 600;
  }
  .empty-state p {
    color: var(--ink-light);
    font-size: 0.9rem;
  }

  /* ── PAGE CONTROLS ── */
  .page-controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1.5rem;
    flex-wrap: wrap;
    gap: 0.75rem;
    position: sticky;
    z-index: 80;
    background: var(--paper);
    padding: 0.85rem 0;
    border-bottom: 1px solid var(--border);
    transition: background 0.25s, border-color 0.25s;
  }
  .page-label {
    font-family: 'Playfair Display', serif;
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--ink-mid);
    flex-shrink: 0;
  }
  .page-label span {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.8rem;
    color: var(--ink-light);
    font-weight: 400;
    margin-left: 0.5rem;
  }
  .page-nav {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    min-width: 0;
    flex: 1 1 auto;
    justify-content: center;
  }
  .nav-btn {
    background: var(--paper-warm);
    border: 1px solid var(--border);
    color: var(--ink);
    width: 34px; height: 34px;
    flex-shrink: 0;
    border-radius: 6px;
    cursor: pointer;
    font-size: 1rem;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
  }
  .nav-btn:hover:not(:disabled) { background: var(--accent-soft); border-color: var(--accent-mid); color: var(--accent); }
  .nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .page-pills {
    display: flex; gap: 4px;
    overflow-x: auto;
    scrollbar-width: none;
    -ms-overflow-style: none;
    -webkit-overflow-scrolling: touch;
    min-width: 0;
    scroll-behavior: smooth;
  }
  .page-pills::-webkit-scrollbar { display: none; }
  .page-pill {
    width: 28px; height: 28px;
    flex-shrink: 0;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: transparent;
    font-size: 0.78rem;
    font-weight: 500;
    cursor: pointer;
    font-family: 'JetBrains Mono', monospace;
    color: var(--ink-light);
    transition: all 0.15s;
  }
  .page-pill.active {
    background: var(--accent-solid);
    border-color: var(--accent-solid);
    color: #fff;
  }
  .page-pill:hover:not(.active) { background: var(--accent-soft); color: var(--accent); border-color: var(--accent-mid); }
  .page-ellipsis {
    width: 20px; height: 28px;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    color: var(--ink-light);
    font-size: 0.78rem;
    font-family: 'JetBrains Mono', monospace;
  }
  .page-size-select {
    background: var(--paper-warm);
    border: 1px solid var(--border);
    color: var(--ink-mid);
    padding: 0.4rem 0.5rem;
    border-radius: 6px;
    font-size: 0.75rem;
    font-family: 'JetBrains Mono', monospace;
    cursor: pointer;
    flex-shrink: 0;
  }
  .search-wrap {
    display: flex;
    align-items: center;
    background: var(--paper-warm);
    border: 1.5px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
    flex: 1 1 160px;
    min-width: 0;
    max-width: 220px;
    transition: border-color 0.2s;
  }
  .search-wrap:focus-within { border-color: var(--accent-mid); }
  #wordSearchInput {
    flex: 1;
    min-width: 0;
    background: transparent;
    border: none;
    outline: none;
    color: var(--ink);
    font-size: 0.8rem;
    font-family: 'Inter', sans-serif;
    padding: 0.45rem 0.6rem;
  }
  .search-go-btn {
    background: transparent;
    border: none;
    color: var(--ink-light);
    width: 30px; height: 30px;
    flex-shrink: 0;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.85rem;
  }
  .search-go-btn:hover { color: var(--accent); }
  tr.row-highlight {
    animation: rowFlash 1.8s ease-out;
  }
  @keyframes rowFlash {
    0%   { background: var(--highlight-flash); }
    100% { background: transparent; }
  }
  .download-btn {
    background: var(--gold-soft);
    border: 1px solid var(--gold-strong);
    color: var(--gold);
    padding: 0.5rem 1rem;
    border-radius: 6px;
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
    display: flex; align-items: center; gap: 0.4rem;
    flex-shrink: 0;
    transition: all 0.15s;
    font-family: 'Inter', sans-serif;
  }
  .download-btn:hover { background: var(--gold-soft); border-color: var(--gold-strong); filter: brightness(1.08); }
  .download-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* ── TABLE ── */
  .table-wrap {
    background: var(--card-bg);
    border-radius: 12px;
    box-shadow: var(--shadow);
    overflow-x: auto;
    overflow-y: hidden;
    border: 1px solid var(--border);
    -webkit-overflow-scrolling: touch;
    transition: background 0.25s, border-color 0.25s;
  }
  table {
    width: 100%;
    min-width: 1180px;
    border-collapse: collapse;
    table-layout: fixed;
  }
  thead {
    background: var(--chrome);
    color: #fff;
  }
  thead th {
    padding: 0.85rem 1rem;
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    text-align: left;
    font-family: 'Inter', sans-serif;
    color: #c0c0e0;
    white-space: nowrap;
  }
  /* Column widths (fixed px so content never compresses/overlaps) */
  col.c-sl    { width: 42px; }
  col.c-diff  { width: 96px; }
  col.c-word  { width: 130px; }
  col.c-hindi { width: 140px; }
  col.c-eng   { width: 260px; }
  col.c-uses  { width: 460px; }
  col.c-actions { width: 52px; }

  tbody tr {
    border-bottom: 1px solid var(--border);
    transition: background 0.15s;
    vertical-align: top;
  }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: var(--row-hover); }
  tbody tr.loading-row { background: var(--accent-soft); }

  td {
    padding: 0.9rem 1rem;
    font-size: 0.83rem;
    line-height: 1.55;
    vertical-align: top;
  }
  .td-sl {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    color: var(--ink-light);
    font-weight: 500;
    padding-top: 1rem;
  }
  .td-word {
    font-family: 'Playfair Display', serif;
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: -0.01em;
  }
  .td-hindi {
    font-size: 0.9rem;
    color: var(--ink-mid);
    font-weight: 500;
  }
  .td-eng {
    color: var(--ink);
    font-size: 0.82rem;
  }
  .td-uses ol {
    padding-left: 1.1rem;
  }
  .td-uses li {
    color: var(--ink-mid);
    margin-bottom: 0.28rem;
    font-size: 0.8rem;
    line-height: 1.5;
  }
  .td-uses li:last-child { margin-bottom: 0; }
  .td-uses li em { color: var(--accent); font-style: normal; font-weight: 600; }

  /* loading skeleton */
  .skeleton {
    background: linear-gradient(90deg, var(--skeleton-a) 25%, var(--skeleton-b) 50%, var(--skeleton-a) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.4s infinite;
    border-radius: 4px;
    height: 0.8em;
    display: inline-block;
  }
  @keyframes shimmer { to { background-position: -200% 0; } }

  /* delete btn */
  .delete-btn {
    background: none;
    border: none;
    color: var(--delete-color);
    cursor: pointer;
    font-size: 0.9rem;
    padding: 2px 4px;
    border-radius: 4px;
    transition: all 0.15s;
    line-height: 1;
  }
  .delete-btn:hover { color: var(--red); background: var(--red-soft); }

  /* row delete button (per-row) */
  .row-delete-btn {
    background: none;
    border: 1px solid transparent;
    color: var(--row-delete-color);
    cursor: pointer;
    font-size: 0.95rem;
    width: 26px; height: 26px;
    border-radius: 6px;
    transition: all 0.15s;
    line-height: 1;
  }
  .row-delete-btn:hover { color: #fff; background: var(--red); border-color: var(--red); }
  .td-actions { text-align: center; }

  /* difficulty stars */
  .td-diff { text-align: left; }
  .diff-stars {
    display: inline-flex;
    gap: 2px;
  }
  .diff-star {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 1.05rem;
    color: var(--star-empty);
    padding: 0;
    line-height: 1;
    transition: transform 0.1s, color 0.15s;
  }
  .diff-star:hover { transform: scale(1.15); }
  .diff-star.filled { color: var(--gold); }
  .diff-star.filled.hard { color: var(--red); }
  .diff-star.filled.medium { color: var(--gold); }
  .diff-star.filled.easy { color: var(--green); }

  /* editable cells */
  [contenteditable="true"] {
    outline: none;
    border-radius: 4px;
    padding: 2px 4px;
    margin: -2px -4px;
    cursor: text;
    transition: background 0.15s, box-shadow 0.15s;
  }
  [contenteditable="true"]:hover {
    background: var(--accent-soft);
  }
  [contenteditable="true"]:focus {
    background: var(--card-bg);
    box-shadow: 0 0 0 2px var(--accent-mid);
  }
  .td-uses li[contenteditable="true"] {
    display: list-item;
  }

  /* ── PDF PRINT PAGE ── */
  @media print {
    body * { visibility: hidden; }
    #printArea, #printArea * { visibility: visible; }
    #printArea { position: absolute; top: 0; left: 0; width: 100%; }
  }

  /* ── RESPONSIVE ── */
  @media (max-width: 768px) {
    .main { padding: 1rem; }
    .input-zone { padding: 1rem; }
    td, th { padding: 0.65rem 0.5rem; }
    .td-word { font-size: 0.9rem; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">Vocab <span>by Aryan</span></div>
  <div class="header-meta">Word by Word · Page by Page</div>
  <div class="header-actions">
    <button id="installBtn" class="header-icon-btn" title="Install App" style="display:none">⤓ Install</button>
    <button id="backupBtn" class="header-icon-btn" title="Backup (download JSON)">⬇ Backup</button>
    <button id="restoreBtn" class="header-icon-btn" title="Restore from JSON">⬆ Restore</button>
    <input type="file" id="restoreInput" accept="application/json" style="display:none">
  </div>
</header>

<div class="input-zone">
  <div class="word-input-wrap">
    <input type="text" id="wordInput" placeholder="Type word(s), comma-separated…" autocomplete="off" spellcheck="false">
    <button id="addBtn" onclick="addWord()" title="Add word" aria-label="Add word">→</button>
  </div>
  <div class="word-count-badge">Total: <strong id="totalCount">0</strong> words</div>
</div>

<div id="statusBar"></div>

<button id="themeFab" title="Toggle night mode" aria-label="Toggle night mode">🌙</button>

<div class="main" id="mainContent">
  <div class="empty-state" id="emptyState">
    <div class="empty-icon">📖</div>
    <h2>Your vocabulary list is empty</h2>
    <p>Type any English word above and press Enter or tap →</p>
  </div>
  <div id="pagesContainer" style="display:none"></div>
</div>

<script>
const { jsPDF } = window.jspdf;

let words = JSON.parse(localStorage.getItem('vsWords') || '[]');
const PAGE_SIZE_OPTIONS = [15, 25, 50];
let PER_PAGE = parseInt(localStorage.getItem('vocab_page_size'), 10) || 15;
if (!PAGE_SIZE_OPTIONS.includes(PER_PAGE)) PER_PAGE = 15;
let currentPage = 1;
let searchQuery = '';
let _pendingHighlightIdx = null;

// ── NIGHT MODE ──
function applyTheme(theme) {
  if (theme === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
    themeFab.textContent = '☀️';
    themeFab.title = 'Switch to light mode';
  } else {
    document.documentElement.removeAttribute('data-theme');
    themeFab.textContent = '🌙';
    themeFab.title = 'Switch to night mode';
  }
}
const themeFab = document.getElementById('themeFab');
const savedTheme = localStorage.getItem('vocab_theme');
const initialTheme = savedTheme || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
applyTheme(initialTheme);
themeFab.addEventListener('click', () => {
  const current = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
  const next = current === 'dark' ? 'light' : 'dark';
  localStorage.setItem('vocab_theme', next);
  applyTheme(next);
});

// ── HTML ESCAPE (prevents broken markup / attribute injection from user-typed or edited text) ──
function escapeHTML(str) {
  if (str === undefined || str === null) return '';
  const div = document.createElement('div');
  div.textContent = String(str);
  return div.innerHTML;
}

// ── STATUS TOAST ──
let statusTimer;
function showStatus(msg, type = 'info', loading = false) {
  const bar = document.getElementById('statusBar');
  bar.innerHTML = loading ? `<div class="spinner"></div> ${msg}` : msg;
  bar.className = 'show' + (type === 'error' ? ' error' : '');
  clearTimeout(statusTimer);
  if (!loading) statusTimer = setTimeout(() => bar.className = '', type === 'error' ? 6000 : 3000);
}
function hideStatus() {
  clearTimeout(statusTimer);
  document.getElementById('statusBar').className = '';
}

// ── KEYBOARD ──
document.getElementById('wordInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') addWord();
});

// ── ADD WORD ──
async function addWord() {
  const input = document.getElementById('wordInput');
  const raw = input.value.trim();
  if (!raw) return;

  // Support comma-separated batches: "cat, dog, apple" adds 3 separate rows
  const rawWords = raw.split(',').map(s => s.trim()).filter(Boolean);
  if (rawWords.length === 0) return;

  input.value = '';
  document.getElementById('addBtn').disabled = true;

  for (const rw of rawWords) {
    const word = rw.charAt(0).toUpperCase() + rw.slice(1).toLowerCase();

    const existing = words.find(w => w.word.toLowerCase() === word.toLowerCase());
    if (existing) {
      const pageOfWord = Math.ceil(existing.sl / PER_PAGE);
      showStatus(`"${word}" is already in your list — Page ${pageOfWord}, #${existing.sl}`, 'error');
      continue;
    }

    showStatus(`Looking up "${word}"…`, 'info', true);

    // placeholder
    const placeholder = { word, sl: words.length + 1, loading: true, difficulty: 0 };
    words.push(placeholder);
    save();
    render();

    try {
      const data = await fetchWordData(word);
      const idx = words.findIndex(w => w.word === word);
      words[idx] = { ...data, sl: idx + 1, word, difficulty: 0 };
      save();
      render();
      showStatus(`✓ "${word}" added successfully`);
    } catch(e) {
      console.error(e);
      const idx = words.findIndex(w => w.word === word);
      words.splice(idx, 1);
      // re-number
      words.forEach((w, i) => w.sl = i + 1);
      save();
      render();
      showStatus(`"${word}": ${describeLookupError(e)}`, 'error');
    }
  }

  document.getElementById('addBtn').disabled = false;
}

// ── FETCH via Netlify Function (keeps the API key server-side) ──
async function fetchWordData(word) {
  let response;
  try {
    response = await fetch("/.netlify/functions/lookup", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ word })
    });
  } catch (networkErr) {
    // fetch() itself threw — no connection reached the server at all
    const err = new Error('network');
    err.kind = 'network';
    throw err;
  }

  let data;
  try {
    data = await response.json();
  } catch (parseErr) {
    const err = new Error('bad_response');
    err.kind = 'bad_response';
    throw err;
  }

  if (!response.ok) {
    const err = new Error(data.error || 'API error');
    err.status = response.status;
    err.kind =
      response.status === 429 ? 'rate_limit' :
      response.status === 500 && /API_KEY/i.test(data.error || '') ? 'missing_key' :
      response.status >= 500 ? 'server' :
      'api';
    throw err;
  }

  return data;
}

// Turn a fetchWordData error into a short, human message with a suggested fix
function describeLookupError(e) {
  switch (e.kind) {
    case 'network':
      return 'No internet connection — check your network and try again.';
    case 'rate_limit':
      return 'Too many lookups at once — please wait a minute and try again.';
    case 'missing_key':
      return 'App isn\'t configured yet (missing API key). Contact the app owner.';
    case 'server':
      return 'Lookup service is having issues — please try again in a moment.';
    case 'bad_response':
      return 'Got an unexpected response — please try again.';
    case 'api':
    default:
      return e.message && e.message !== 'API error'
        ? e.message
        : 'Something went wrong looking that up — please try again.';
  }
}

// ── SAVE ──
function save() {
  localStorage.setItem('vsWords', JSON.stringify(words));
  document.getElementById('totalCount').textContent = words.filter(w => !w.loading).length;
}

// ── DELETE ──
function deleteWord(idx) {
  words.splice(idx, 1);
  words.forEach((w, i) => w.sl = i + 1);
  save();
  // adjust current page if needed
  const totalPages = Math.ceil(words.length / PER_PAGE) || 1;
  if (currentPage > totalPages) currentPage = totalPages;
  render();
  showStatus('Word removed');
}

// ── DIFFICULTY RATING ──
function setDifficulty(idx, val) {
  const w = words[idx];
  if (!w) return;
  // clicking the same star again clears the rating
  w.difficulty = (w.difficulty === val) ? 0 : val;
  save();
  render();
}

// ── INLINE EDITING ──
function editKeydown(e) {
  if (e.key === 'Enter') {
    e.preventDefault();
    e.target.blur();
  }
}

function editField(idx, field, el) {
  const w = words[idx];
  if (!w) return;
  const val = el.textContent.trim();
  w[field] = val;
  save();
}

function editUse(idx, useIdx, el) {
  const w = words[idx];
  if (!w) return;
  if (!w.uses) w.uses = [];
  w.uses[useIdx] = el.innerHTML.trim();
  save();
}

// ── RENDER ──
function render() {
  const container = document.getElementById('pagesContainer');
  const empty = document.getElementById('emptyState');

  // Preserve focus/cursor on the search box across re-renders (it gets
  // rebuilt every render() call, which would otherwise steal focus while
  // the person is mid-typing)
  const searchWasFocused = document.activeElement && document.activeElement.id === 'wordSearchInput';
  const searchCaret = searchWasFocused ? document.activeElement.selectionStart : null;

  if (words.length === 0) {
    empty.style.display = '';
    container.style.display = 'none';
    updateStickyOffsets();
    return;
  }
  empty.style.display = 'none';
  container.style.display = '';

  const totalPages = Math.ceil(words.length / PER_PAGE);
  if (currentPage > totalPages) currentPage = totalPages;

  container.innerHTML = '';

  // Page controls
  const ctrl = document.createElement('div');
  ctrl.className = 'page-controls';

  const pageLabel = document.createElement('div');
  pageLabel.className = 'page-label';
  pageLabel.innerHTML = `Page ${currentPage} of ${totalPages}<span>${words.length} word${words.length !== 1 ? 's' : ''}</span>`;

  // Search box — finds a word and jumps to whichever page it's on
  const searchWrap = document.createElement('div');
  searchWrap.className = 'search-wrap';
  const searchInput = document.createElement('input');
  searchInput.type = 'search';
  searchInput.id = 'wordSearchInput';
  searchInput.placeholder = 'Search word…';
  searchInput.value = searchQuery;
  searchInput.autocomplete = 'off';
  let searchDebounce;
  searchInput.addEventListener('input', () => {
    searchQuery = searchInput.value;
    clearTimeout(searchDebounce);
    searchDebounce = setTimeout(() => performSearch(searchQuery, false), 350);
  });
  searchInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { clearTimeout(searchDebounce); performSearch(searchInput.value, true); }
  });
  const searchGoBtn = document.createElement('button');
  searchGoBtn.className = 'search-go-btn';
  searchGoBtn.title = 'Search';
  searchGoBtn.textContent = '🔍';
  searchGoBtn.onclick = () => performSearch(searchInput.value, true);
  searchWrap.append(searchInput, searchGoBtn);

  if (searchWasFocused) {
    // restore focus after this element replaces the old one
    setTimeout(() => {
      searchInput.focus();
      const pos = searchCaret != null ? searchCaret : searchInput.value.length;
      searchInput.setSelectionRange(pos, pos);
    }, 0);
  }

  const nav = document.createElement('div');
  nav.className = 'page-nav';

  const firstBtn = document.createElement('button');
  firstBtn.className = 'nav-btn';
  firstBtn.title = 'First page';
  firstBtn.textContent = '«';
  firstBtn.disabled = currentPage === 1;
  firstBtn.onclick = () => { currentPage = 1; render(); window.scrollTo(0,0); };

  const prevBtn = document.createElement('button');
  prevBtn.className = 'nav-btn';
  prevBtn.title = 'Previous page';
  prevBtn.textContent = '←';
  prevBtn.disabled = currentPage === 1;
  prevBtn.onclick = () => { currentPage--; render(); window.scrollTo(0,0); };

  const pills = document.createElement('div');
  pills.className = 'page-pills';

  function makePill(p) {
    const pill = document.createElement('button');
    pill.className = 'page-pill' + (p === currentPage ? ' active' : '');
    pill.textContent = p;
    pill.onclick = () => { currentPage = p; render(); window.scrollTo(0,0); };
    return pill;
  }

  // Only ever show up to 3 page numbers: current ±1, clamped to range.
  // Reaching farther pages is done via the ← → « » buttons instead.
  let start = Math.max(1, currentPage - 1);
  let end = Math.min(totalPages, start + 2);
  start = Math.max(1, end - 2);
  for (let p = start; p <= end; p++) pills.appendChild(makePill(p));

  const nextBtn = document.createElement('button');
  nextBtn.className = 'nav-btn';
  nextBtn.title = 'Next page';
  nextBtn.textContent = '→';
  nextBtn.disabled = currentPage === totalPages;
  nextBtn.onclick = () => { currentPage++; render(); window.scrollTo(0,0); };

  const lastBtn = document.createElement('button');
  lastBtn.className = 'nav-btn';
  lastBtn.title = 'Last page';
  lastBtn.textContent = '»';
  lastBtn.disabled = currentPage === totalPages;
  lastBtn.onclick = () => { currentPage = totalPages; render(); window.scrollTo(0,0); };

  nav.append(firstBtn, prevBtn, pills, nextBtn, lastBtn);

  const pageSizeSelect = document.createElement('select');
  pageSizeSelect.className = 'page-size-select';
  pageSizeSelect.title = 'Words per page';
  PAGE_SIZE_OPTIONS.forEach(n => {
    const opt = document.createElement('option');
    opt.value = n;
    opt.textContent = `${n}/page`;
    if (n === PER_PAGE) opt.selected = true;
    pageSizeSelect.appendChild(opt);
  });
  pageSizeSelect.onchange = () => {
    PER_PAGE = parseInt(pageSizeSelect.value, 10);
    localStorage.setItem('vocab_page_size', String(PER_PAGE));
    currentPage = 1;
    render();
  };

  const dlBtn = document.createElement('button');
  dlBtn.className = 'download-btn';
  dlBtn.innerHTML = `⬇ Download Page ${currentPage} PDF`;
  dlBtn.onclick = () => downloadPDF(currentPage);
  const pageWords = words.slice((currentPage-1)*PER_PAGE, currentPage*PER_PAGE);
  if (pageWords.some(w => w.loading)) dlBtn.disabled = true;

  ctrl.append(pageLabel, searchWrap, nav, pageSizeSelect, dlBtn);
  container.appendChild(ctrl);

  // Table
  const tableWrap = document.createElement('div');
  tableWrap.className = 'table-wrap';
  tableWrap.id = `page-table-${currentPage}`;

  const table = document.createElement('table');
  table.innerHTML = `
    <colgroup>
      <col class="c-sl"><col class="c-diff"><col class="c-word"><col class="c-hindi"><col class="c-eng"><col class="c-uses"><col class="c-actions">
    </colgroup>
    <thead>
      <tr>
        <th>#</th>
        <th>Difficulty</th>
        <th>Word</th>
        <th>Hindi</th>
        <th>English Meaning</th>
        <th>Usage Examples</th>
        <th></th>
      </tr>
    </thead>
  `;

  const tbody = document.createElement('tbody');

  pageWords.forEach((w, i) => {
    const globalIdx = (currentPage - 1) * PER_PAGE + i;
    const tr = document.createElement('tr');
    tr.dataset.globalIdx = globalIdx;

    if (w.loading) {
      tr.className = 'loading-row';
      tr.innerHTML = `
        <td class="td-sl">${w.sl}</td>
        <td class="td-diff"><span class="skeleton" style="width:50px"></span></td>
        <td class="td-word">${escapeHTML(w.word)}</td>
        <td><span class="skeleton" style="width:60px"></span></td>
        <td><span class="skeleton" style="width:140px"></span><br><span class="skeleton" style="width:100px;margin-top:4px"></span></td>
        <td>
          <span class="skeleton" style="width:90%"></span><br>
          <span class="skeleton" style="width:80%;margin-top:6px"></span><br>
          <span class="skeleton" style="width:85%;margin-top:6px"></span>
        </td>
        <td></td>
      `;
    } else {
      const usesHTML = (w.uses || []).map((s, ui) =>
        `<li contenteditable="true" spellcheck="false" data-idx="${globalIdx}" data-use-idx="${ui}" class="use-item">${s}</li>`
      ).join('');

      const diff = w.difficulty || 0;
      const starClass = diff === 1 ? 'easy' : diff === 2 ? 'medium' : diff === 3 ? 'hard' : '';
      const starsHTML = [1, 2, 3].map(n =>
        `<button class="diff-star${n <= diff ? ' filled ' + starClass : ''} diff-star-btn" title="Rate difficulty ${n}" data-idx="${globalIdx}" data-val="${n}">★</button>`
      ).join('');

      tr.innerHTML = `
        <td class="td-sl">${w.sl}</td>
        <td class="td-diff"><span class="diff-stars">${starsHTML}</span></td>
        <td class="td-word" contenteditable="true" spellcheck="false" data-idx="${globalIdx}" data-field="word" class="field-item">${escapeHTML(w.word)}</td>
        <td class="td-hindi" contenteditable="true" spellcheck="false" data-idx="${globalIdx}" data-field="hindi" class="field-item">${escapeHTML(w.hindi) || '—'}</td>
        <td class="td-eng" contenteditable="true" spellcheck="false" data-idx="${globalIdx}" data-field="english" class="field-item">${escapeHTML(w.english) || '—'}</td>
        <td class="td-uses"><ol>${usesHTML}</ol></td>
        <td class="td-actions"><button class="row-delete-btn delete-row-btn" title="Delete this word" data-idx="${globalIdx}">✕</button></td>
      `;
    }
    tbody.appendChild(tr);
  });

  // wire up delegated events for this render pass
  tbody.querySelectorAll('.field-item, [data-field]').forEach(el => {
    el.addEventListener('blur', () => editField(parseInt(el.dataset.idx, 10), el.dataset.field, el));
    el.addEventListener('keydown', editKeydown);
  });
  tbody.querySelectorAll('.use-item').forEach(el => {
    el.addEventListener('blur', () => editUse(parseInt(el.dataset.idx, 10), parseInt(el.dataset.useIdx, 10), el));
  });
  tbody.querySelectorAll('.diff-star-btn').forEach(el => {
    el.addEventListener('click', () => setDifficulty(parseInt(el.dataset.idx, 10), parseInt(el.dataset.val, 10)));
  });
  tbody.querySelectorAll('.delete-row-btn').forEach(el => {
    el.addEventListener('click', () => {
      const idx = parseInt(el.dataset.idx, 10);
      const w = words[idx];
      if (!w) return;
      if (confirm(`Delete "${w.word}"?`)) deleteWord(idx);
    });
  });

  table.appendChild(tbody);
  tableWrap.appendChild(table);
  container.appendChild(tableWrap);

  // hint
  if (words.filter(w => !w.loading).length > 0) {
    const hintLines = [
      'Scroll table horizontally to see all columns',
      'Click any cell to edit',
      'Click stars to rate difficulty',
      '✕ to delete a row'
    ];
    const hint = document.createElement('div');
    hint.style.cssText = 'font-size:0.72rem;color:var(--hint-color);margin-top:0.75rem;text-align:right;line-height:1.6;';
    hint.innerHTML = hintLines.map(l => `<div>${l}</div>`).join('');
    container.appendChild(hint);
  }

  updateStickyOffsets();

  if (_pendingHighlightIdx !== null) {
    const idxToHighlight = _pendingHighlightIdx;
    _pendingHighlightIdx = null;
    setTimeout(() => highlightRow(idxToHighlight), 50);
  }
}

// ── SEARCH ──
function highlightRow(idx) {
  const tr = document.querySelector(`tr[data-global-idx="${idx}"]`);
  if (!tr) return;
  tr.scrollIntoView({ behavior: 'smooth', block: 'center' });
  tr.classList.remove('row-highlight');
  void tr.offsetWidth; // restart animation if triggered again quickly
  tr.classList.add('row-highlight');
  setTimeout(() => tr.classList.remove('row-highlight'), 1800);
}

function performSearch(query, isExplicit) {
  const q = query.trim();
  if (!q) return;

  const qLower = q.toLowerCase();
  let match = words.find(w => w.word && w.word.toLowerCase() === qLower);
  if (!match) match = words.find(w => w.word && w.word.toLowerCase().includes(qLower));

  if (!match) {
    if (isExplicit) showStatus(`No word found matching "${q}"`, 'error');
    return;
  }

  const idx = words.indexOf(match);
  const targetPage = Math.ceil(match.sl / PER_PAGE);

  if (targetPage !== currentPage) {
    _pendingHighlightIdx = idx;
    currentPage = targetPage;
    render();
  } else {
    highlightRow(idx);
  }
}

// ── STICKY OFFSETS (header + input bar + page controls stay frozen at top) ──
function updateStickyOffsets() {
  const header = document.querySelector('header');
  const inputZone = document.querySelector('.input-zone');
  const ctrl = document.querySelector('.page-controls');
  if (!header || !inputZone) return;
  const headerH = header.offsetHeight;
  inputZone.style.top = headerH + 'px';
  if (ctrl) {
    ctrl.style.top = (headerH + inputZone.offsetHeight) + 'px';
  }
}
window.addEventListener('load', updateStickyOffsets);
let _stickyResizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(_stickyResizeTimer);
  _stickyResizeTimer = setTimeout(updateStickyOffsets, 120);
});

// ── PDF DOWNLOAD ──
let _devanagariFontB64 = null; // cached after first fetch

async function loadDevanagariFont() {
  if (_devanagariFontB64) return _devanagariFontB64;
  const url = 'https://cdn.jsdelivr.net/gh/openmaptiles/fonts/noto-sans/NotoSansDevanagari-Regular.ttf';
  const res = await fetch(url);
  if (!res.ok) throw new Error('font fetch failed');
  const buf = await res.arrayBuffer();
  const bytes = new Uint8Array(buf);
  let binary = '';
  const chunk = 0x8000;
  for (let i = 0; i < bytes.length; i += chunk) {
    binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
  }
  _devanagariFontB64 = btoa(binary);
  return _devanagariFontB64;
}

async function downloadPDF(pageNum) {
  const dlBtn = document.querySelector('.download-btn');
  if (dlBtn) { dlBtn.disabled = true; dlBtn.textContent = 'Generating…'; }

  try {
    const pageWords = words.slice((pageNum-1)*PER_PAGE, pageNum*PER_PAGE);

    const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
    const pw = doc.internal.pageSize.getWidth();
    const ph = doc.internal.pageSize.getHeight();

    // Try to load a Hindi-capable font; fall back gracefully if offline
    let hindiFontOk = false;
    try {
      const fontB64 = await loadDevanagariFont();
      doc.addFileToVFS('NotoSansDevanagari.ttf', fontB64);
      doc.addFont('NotoSansDevanagari.ttf', 'NotoDevanagari', 'normal');
      hindiFontOk = true;
    } catch (fontErr) {
      console.error('Devanagari font failed to load, Hindi text may not render:', fontErr);
    }

    // ── Palette ──
    const INDIGO = [79, 70, 229];
    const INDIGO_DK = [40, 34, 110];
    const INK = [26, 26, 46];
    const SLATE = [100, 100, 130];
    const CARD_BG = [250, 250, 253];
    const CARD_BORDER = [225, 224, 240];

    const MARGIN = 8;

    function drawHeader() {
      // gradient-ish header band (two overlapping rects for depth)
      doc.setFillColor(...INK);
      doc.rect(0, 0, pw, 20, 'F');
      doc.setFillColor(...INDIGO_DK);
      doc.rect(0, 16, pw, 4, 'F');

      // little mark
      doc.setFillColor(...INDIGO);
      doc.roundedRect(MARGIN, 4.5, 11, 11, 2, 2, 'F');
      doc.setTextColor(255,255,255);
      doc.setFont('helvetica','bold');
      doc.setFontSize(9);
      doc.text('V', MARGIN + 5.5, 11.8, { align: 'center' });

      doc.setFont('helvetica','bold');
      doc.setFontSize(13);
      doc.setTextColor(255,255,255);
      doc.text('Vocab by Aryan', MARGIN + 15, 9.5);
      doc.setFont('helvetica','normal');
      doc.setFontSize(6.8);
      doc.setTextColor(175,172,225);
      doc.text('Personal Vocabulary Journal', MARGIN + 15, 14.5);

      doc.setFont('helvetica','bold');
      doc.setFontSize(8.5);
      doc.setTextColor(255,255,255);
      doc.text(`Page ${pageNum}`, pw - MARGIN, 9.5, { align: 'right' });
      doc.setFont('helvetica','normal');
      doc.setFontSize(6.8);
      doc.setTextColor(175,172,225);
      doc.text(`${pageWords.length} words`, pw - MARGIN, 14.5, { align: 'right' });
    }

    function drawFooter() {
      doc.setDrawColor(...CARD_BORDER);
      doc.setLineWidth(0.2);
      doc.line(MARGIN, ph - 10, pw - MARGIN, ph - 10);
      doc.setFont('helvetica','normal');
      doc.setFontSize(6.3);
      doc.setTextColor(...SLATE);
      doc.text('Vocab by Aryan', MARGIN, ph - 5.5);
      doc.text(
        new Date().toLocaleDateString('en-IN', {day:'numeric',month:'long',year:'numeric'}),
        pw / 2, ph - 5.5, { align: 'center' }
      );
      doc.text(`Sheet ${doc.internal.getNumberOfPages()}`, pw - MARGIN, ph - 5.5, { align: 'right' });
    }

    // Column geometry (content area inside cards)
    const cardX = MARGIN;
    const cardW = pw - MARGIN * 2;
    const cols = {
      sl:     { x: cardX + 3,   w: 7  },
      diff:   { x: cardX + 11,  w: 10 },
      word:   { x: cardX + 23,  w: 32 },
      hindi:  { x: cardX + 57,  w: 28 },
      eng:    { x: cardX + 87,  w: 62 },
      uses:   { x: cardX + 151, w: cardW - 151 - 3 },
    };

    drawHeader();
    let y = 27;
    const lineH = 3.3;
    const padY = 4;

    pageWords.forEach((w) => {
      // Pre-measure content to know card height
      doc.setFont('helvetica','normal'); doc.setFontSize(6.9);
      const engLines = doc.splitTextToSize(w.english || '—', cols.eng.w);

      doc.setFontSize(6.9);
      const usesRaw = (w.uses || []).map((s, idx) => `${idx+1}.  ${s.replace(/<\/?b>/g,'')}`);
      let usesLines = [];
      usesRaw.forEach(u => usesLines = usesLines.concat(doc.splitTextToSize(u, cols.uses.w)));

      if (hindiFontOk) doc.setFont('NotoDevanagari','normal'); else doc.setFont('helvetica','normal');
      doc.setFontSize(8);
      const hindiLines = doc.splitTextToSize(w.hindi || '—', cols.hindi.w);

      const contentLines = Math.max(engLines.length, usesLines.length, hindiLines.length, 2);
      const cardH = padY * 2 + contentLines * lineH;

      if (y + cardH > ph - 13) {
        drawFooter();
        doc.addPage();
        drawHeader();
        y = 27;
      }

      // Card background + border
      doc.setFillColor(...CARD_BG);
      doc.setDrawColor(...CARD_BORDER);
      doc.setLineWidth(0.25);
      doc.roundedRect(cardX, y, cardW, cardH, 1.6, 1.6, 'FD');

      // left accent strip colored by difficulty
      const diffVal = w.difficulty || 0;
      const diffColor = diffVal === 3 ? [220,38,38] : diffVal === 2 ? [217,119,6] : diffVal === 1 ? [5,150,105] : [190,190,215];
      doc.setFillColor(...diffColor);
      doc.roundedRect(cardX, y, 1.6, cardH, 0.8, 0.8, 'F');

      const textY = y + padY + 2.2;

      // SL
      doc.setFont('courier','normal'); doc.setFontSize(6.5);
      doc.setTextColor(...SLATE);
      doc.text(String(w.sl), cols.sl.x, textY);

      // Difficulty pips — drawn as vector circles (not text glyphs) so they
      // always render correctly regardless of font/encoding support
      const pipR = 0.9, pipGap = 2.3;
      let pipX = cols.diff.x;
      const pipY = textY - 1.1;
      for (let i = 0; i < 3; i++) {
        if (i < diffVal) {
          doc.setFillColor(...diffColor);
          doc.circle(pipX, pipY, pipR, 'F');
        } else {
          doc.setDrawColor(200,200,215);
          doc.setLineWidth(0.15);
          doc.circle(pipX, pipY, pipR, 'S');
        }
        pipX += pipGap;
      }

      // Word — auto-shrink font size so long words/phrases never overflow
      // into the neighboring Hindi column
      doc.setFont('helvetica','bold');
      let wordFontSize = 9.5;
      const wordText = w.word || '';
      doc.setFontSize(wordFontSize);
      while (wordFontSize > 6 && doc.getTextWidth(wordText) > cols.word.w) {
        wordFontSize -= 0.5;
        doc.setFontSize(wordFontSize);
      }
      doc.setTextColor(...INDIGO);
      doc.text(wordText, cols.word.x, textY + 1);

      // Hindi (Devanagari font if available)
      if (hindiFontOk) doc.setFont('NotoDevanagari','normal'); else doc.setFont('helvetica','normal');
      doc.setFontSize(8);
      doc.setTextColor(...INK);
      doc.text(hindiLines, cols.hindi.x, textY);

      // English meaning
      doc.setFont('helvetica','normal'); doc.setFontSize(6.9);
      doc.setTextColor(50,50,75);
      doc.text(engLines, cols.eng.x, textY, { lineHeightFactor: 1.35 });

      // Usage examples
      doc.setFont('helvetica','normal'); doc.setFontSize(6.9);
      doc.setTextColor(70,70,100);
      doc.text(usesLines, cols.uses.x, textY, { lineHeightFactor: 1.35 });

      y += cardH + 3;
    });

    drawFooter();

    if (!hindiFontOk) {
      showStatus('PDF downloaded (Hindi font unavailable offline — reconnect and retry for Hindi text)', 'error');
    } else {
      showStatus('PDF downloaded!');
    }

    doc.save(`VocabByAryan_Page${pageNum}.pdf`);
  } catch(e) {
    console.error(e);
    showStatus('PDF generation failed', 'error');
  }

  if (dlBtn) { dlBtn.disabled = false; dlBtn.textContent = `⬇ Download Page ${pageNum} PDF`; }
}

// ── JSON BACKUP ──
function backupWords() {
  if (words.length === 0) {
    showStatus('Nothing to backup yet', 'error');
    return;
  }
  const payload = {
    app: 'Vocab by Aryan',
    exportedAt: new Date().toISOString(),
    words
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `VocabByAryan_Backup_${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showStatus('Backup downloaded!');
}

// ── JSON RESTORE ──
function restoreWords(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const parsed = JSON.parse(e.target.result);
      const incoming = Array.isArray(parsed) ? parsed : parsed.words;
      if (!Array.isArray(incoming)) throw new Error('Invalid backup file format');

      const valid = incoming.filter(w => w && typeof w.word === 'string' && w.word.trim());
      if (valid.length === 0) throw new Error('No valid words found in file');

      const proceed = words.length === 0
        ? true
        : confirm(`This will replace your current list of ${words.length} word(s) with ${valid.length} word(s) from the backup. Continue?`);
      if (!proceed) return;

      words = valid.map((w, i) => ({
        word: w.word,
        hindi: w.hindi || '',
        english: w.english || '',
        uses: Array.isArray(w.uses) ? w.uses : [],
        difficulty: w.difficulty || 0,
        sl: i + 1
      }));
      currentPage = 1;
      save();
      render();
      showStatus(`Restored ${words.length} word${words.length !== 1 ? 's' : ''}!`);
    } catch (err) {
      console.error(err);
      showStatus('Restore failed: invalid JSON file', 'error');
    }
  };
  reader.onerror = () => showStatus('Failed to read file', 'error');
  reader.readAsText(file);
}

document.getElementById('backupBtn').addEventListener('click', backupWords);
document.getElementById('restoreBtn').addEventListener('click', () => document.getElementById('restoreInput').click());
document.getElementById('restoreInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  restoreWords(file);
  e.target.value = '';
});

// ── PWA: SERVICE WORKER REGISTRATION ──
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(err => console.error('SW registration failed:', err));
  });
}

// ── PWA: INSTALL PROMPT ──
let deferredInstallPrompt = null;
const installBtn = document.getElementById('installBtn');

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
  installBtn.style.display = '';
});

installBtn.addEventListener('click', async () => {
  if (!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  const { outcome } = await deferredInstallPrompt.userChoice;
  if (outcome === 'accepted') showStatus('App installed!');
  deferredInstallPrompt = null;
  installBtn.style.display = 'none';
});

window.addEventListener('appinstalled', () => {
  installBtn.style.display = 'none';
  showStatus('Vocab by Aryan installed!');
});

// ── INIT ──
document.getElementById('totalCount').textContent = words.filter(w => !w.loading).length;
// clear any stale loading placeholders
words = words.filter(w => !w.loading);
words.forEach((w, i) => w.sl = i + 1);
save();
render();
</script>
